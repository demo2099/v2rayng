name: Build APK (AnyTLS)

on:
  workflow_dispatch:
  push:
    branches:
      - anytls-support
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      continue-on-error: true
      run: bash compile-hevtun.sh || true

    - name: Prepare libs
      run: |
        mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
        cp -r ${{ github.workspace }}/libs/* ${{ github.workspace }}/V2rayNG/app/libs/ 2>/dev/null || true

    - name: Download libv2ray
      run: |
        curl -sL -o ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar \
          "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.8.20/libv2ray.aar"
        ls -la ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleFdroidDebug --stacktrace

    - name: Find all APK and build outputs
      if: always()
      run: |
        echo "=== ALL build output files ==="
        find ${{ github.workspace }}/V2rayNG/app/build/outputs -type f 2>/dev/null || echo "No outputs dir"
        echo "=== ALL APK files ==="
        find ${{ github.workspace }} -name "*.apk" 2>/dev/null || echo "No APK anywhere"
        echo "=== Gradle tasks ==="
        cd ${{ github.workspace }}/V2rayNG && ./gradlew tasks --all 2>&1 | grep -i "assemble.*fdroid" || echo "No fdroid tasks found"

    - name: Upload Build Outputs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: v2rayNG-anytls-debug
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/
