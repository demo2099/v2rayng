name: Build APK (AnyTLS)

on:
  workflow_dispatch:
  push:
    branches:
      - anytls-support
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      continue-on-error: true
      run: bash compile-hevtun.sh || true

    - name: Prepare libs
      run: |
        mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
        cp -r ${{ github.workspace }}/libs/* ${{ github.workspace }}/V2rayNG/app/libs/ 2>/dev/null || true

    - name: Download libv2ray
      run: |
        curl -sL -o ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar \
          "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.8.20/libv2ray.aar"
        ls -la ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        set +e
        ./gradlew assembleFdroidDebug --stacktrace 2>&1 | tee /tmp/build.log
        BUILD_EXIT=${PIPESTATUS[0]}
        echo "BUILD_EXIT=$BUILD_EXIT" >> $GITHUB_ENV
        echo "exit code: $BUILD_EXIT"
        exit 0

    - name: Dump build log to summary
      if: always()
      run: |
        echo '<details><summary>Build Log (last 200 lines)</summary>' >> $GITHUB_STEP_SUMMARY
        echo '' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -200 /tmp/build.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No build log" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo '</details>' >> $GITHUB_STEP_SUMMARY
        echo '' >> $GITHUB_STEP_SUMMARY
        echo "## File search" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        find ${{ github.workspace }}/V2rayNG/app/build/outputs -type f 2>/dev/null | head -50 >> $GITHUB_STEP_SUMMARY || echo "No outputs" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Debug APK
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: v2rayNG-anytls-debug
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/debug/
