name: Build & Release APK (AnyTLS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      continue-on-error: true
      run: bash compile-hevtun.sh || true

    - name: Prepare libs
      run: |
        mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
        cp -r ${{ github.workspace }}/libs/* ${{ github.workspace }}/V2rayNG/app/libs/ 2>/dev/null || true

    - name: Download libv2ray
      run: |
        curl -sL -o ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar \
          "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.8.20/libv2ray.aar"
        ls -la ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Get version info
      id: version
      run: |
        cd ${{ github.workspace }}/V2rayNG
        VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
        CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*= \([0-9]*\).*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "code=$CODE" >> $GITHUB_OUTPUT
        echo "tag=anytls-v${VERSION}-${CODE}" >> $GITHUB_OUTPUT
        echo "Version: $VERSION Code: $CODE"

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleFdroidDebug

    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/debug -name "*.apk" -print -quit 2>/dev/null)
        if [ -z "$APK_PATH" ]; then
          APK_PATH=$(find ${{ github.workspace }}/V2rayNG/app/build/outputs -name "*.apk" -print -quit 2>/dev/null)
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Found APK: $APK_PATH"
        ls -lh "$APK_PATH" 2>/dev/null || echo "APK not found"

    - name: Upload Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ steps.version.outputs.tag }}
        release_name: "AnyTLS Build ${{ steps.version.outputs.version }}"
        body: |
          v2rayNG with AnyTLS protocol support.
          
          ## AnyTLS + Reality URI format
          ```
          anytls://password@server:port?security=reality&sni=xxx&fp=chrome&pbk=xxx&sid=xxx&type=tcp#Name
          ```
        file: ${{ steps.find_apk.outputs.apk_path }}
        asset_name: v2rayNG-anytls-${{ steps.version.outputs.version }}-fdroid.apk
        overwrite: true
        make_latest: true
