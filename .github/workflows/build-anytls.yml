name: Build APK (AnyTLS)

on:
  workflow_dispatch:
  push:
    branches:
      - anytls-support
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Init submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive || true
        # Verify AndroidLibXrayLite exists
        if [ ! -d "AndroidLibXrayLite" ] || [ -z "$(ls -A AndroidLibXrayLite 2>/dev/null)" ]; then
          echo "AndroidLibXrayLite not found, cloning directly..."
          git clone https://github.com/2dust/AndroidLibXrayLite.git AndroidLibXrayLite
        fi
        ls -la AndroidLibXrayLite/

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      continue-on-error: true
      run: bash compile-hevtun.sh || true

    - name: Copy libhevtun
      continue-on-error: true
      run: |
        mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
        cp -r ${{ github.workspace }}/libs/* ${{ github.workspace }}/V2rayNG/app/libs/ 2>/dev/null || true

    - name: Fetch AndroidLibXrayLite tag
      run: |
        cd AndroidLibXrayLite
        git fetch --tags || true
        CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$CURRENT_TAG" ]; then
          echo "No tags found, trying latest release..."
          CURRENT_TAG=$(git tag --sort=-version:refname | head -1)
        fi
        echo "Current tag: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        cd ..

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Debug APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleFdroidDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: v2rayNG-anytls-debug
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
