name: Build APK (AnyTLS)

on:
  workflow_dispatch:
  push:
    branches:
      - anytls-support
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Add NDK version to build.gradle.kts
      run: |
        cd V2rayNG/app
        sed -i '10a\            ndkVersion = "29.0.14206865"' build.gradle.kts

    - name: Build libhevtun (optional)
      continue-on-error: true
      run: bash compile-hevtun.sh || true

    - name: Prepare libs directory
      run: |
        mkdir -p V2rayNG/app/libs
        cp -r libs/* V2rayNG/app/libs/ 2>/dev/null || true

    - name: Download libv2ray.aar
      run: |
        cd V2rayNG/app/libs
        curl -sL -o libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.8.20/libv2ray.aar"
        ls -la libv2ray.aar

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Debug APK
      id: build
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        set -o pipefail
        ./gradlew assembleFdroidDebug --stacktrace 2>&1 | tee /tmp/build.log

    - name: Collect build info
      if: always()
      run: |
        echo "## Build Output" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -80 /tmp/build.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No build log" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "## APK Files" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        find V2rayNG/app/build/outputs -name "*.apk" -exec ls -lh {} \; 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No APK found" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-log
        path: /tmp/build.log

    - name: Upload Debug APK
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: v2rayNG-anytls-debug
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/**/*.apk
