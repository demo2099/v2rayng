name: Build v2rayNG with sing-box (AnyTLS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Download libbox.aar (sing-box)
      run: |
        mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
        curl -sL -o /tmp/libbox-android.aar.zip \
          "https://github.com/proother/sing-box-lib/releases/download/v1.13.21/libbox-android.aar.zip"
        cd /tmp && unzip -q libbox-android.aar.zip
        cp /tmp/libbox-android/libbox.aar ${{ github.workspace }}/V2rayNG/app/libs/
        ls -lh ${{ github.workspace }}/V2rayNG/app/libs/libbox.aar

    - name: Remove libv2ray (replaced by libbox)
      run: |
        rm -f ${{ github.workspace }}/V2rayNG/app/libs/libv2ray.aar
        rm -f ${{ github.workspace }}/V2rayNG/app/libs/libhev-socks5-tunnel.so

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Get version info
      id: version
      run: |
        cd ${{ github.workspace }}/V2rayNG
        VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
        CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*= \([0-9]*\).*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "code=$CODE" >> $GITHUB_OUTPUT
        echo "tag=singbox-v${VERSION}-${CODE}" >> $GITHUB_OUTPUT
        echo "Version: $VERSION Code: $CODE"

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleFdroidDebug

    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/debug -name "*.apk" -print -quit 2>/dev/null)
        if [ -z "$APK_PATH" ]; then
          APK_PATH=$(find ${{ github.workspace }}/V2rayNG/app/build/outputs -name "*.apk" -print -quit 2>/dev/null)
        fi
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "Found APK: $APK_PATH"
        ls -lh "$APK_PATH" 2>/dev/null || echo "APK not found"

    - name: Upload Release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ steps.version.outputs.tag }}
        release_name: "sing-box Build ${{ steps.version.outputs.version }}"
        body: |
          v2rayNG with sing-box core (replaces xray-core).
          Supports AnyTLS+REALITY and all standard protocols.
          
          ## Protocols
          AnyTLS, VMess, VLESS, Shadowsocks, Trojan, WireGuard, Hysteria2, SOCKS, HTTP
          
          ## AnyTLS + Reality URI format
          ```
          anytls://password@server:port?security=reality&sni=xxx&fp=chrome&pbk=xxx&sid=xxx&type=tcp#Name
          ```
        file: ${{ steps.find_apk.outputs.apk_path }}
        asset_name: v2rayNG-singbox-${{ steps.version.outputs.version }}-fdroid.apk
        overwrite: true
        make_latest: true
