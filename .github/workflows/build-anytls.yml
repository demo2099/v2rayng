name: Build APK (AnyTLS)

on:
  workflow_dispatch:
  push:
    branches:
      - anytls-support
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Debug submodules
      run: |
        echo "=== .gitmodules ==="
        cat .gitmodules 2>/dev/null || echo "No .gitmodules"
        echo "=== AndroidLibXrayLite ==="
        ls -la AndroidLibXrayLite/ 2>/dev/null || echo "Directory empty or missing"
        echo "=== hev-socks5-tunnel ==="
        ls -la hev-socks5-tunnel/ 2>/dev/null || echo "Directory empty or missing"
        echo "=== git submodule status ==="
        git submodule status 2>&1

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      continue-on-error: true
      run: bash compile-hevtun.sh

    - name: Copy libhevtun
      continue-on-error: true
      run: cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        git fetch --tags 2>&1 || true
        CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$CURRENT_TAG" ]; then
          CURRENT_TAG="v26.8.20"
          echo "Using fallback tag: $CURRENT_TAG"
        fi
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleFdroidDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: v2rayNG-anytls-debug
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/debug/*.apk
